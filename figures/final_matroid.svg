<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" role="img">
<title>A rank-three Desargues obstruction</title>
<desc>Matroid incidence diagram. Only marked points are elements. Curves mark rank-two flats; rank-four plane panels mark rank-three flats.</desc>
<g font-family="DejaVu Sans, sans-serif">
<text x="30" y="38" font-size="25" fill="#172033">A rank-three Desargues obstruction</text>
<text x="30" y="67" font-size="17" fill="#172033">Rank 3; 10 elements; 104 bases</text>
<polygon data-triangle="2 15 12" points="360,330 520,250 200,170" fill="#265eab" fill-opacity="0.10"/>
<polygon data-triangle="6 16 8" points="840,330 382.857,284.286 200,650" fill="#d17b0f" fill-opacity="0.10"/>
<path data-flat="1 2 15" d="M 520,250 L 360,330 C 220,400 68,380 72,253.2" fill="none" stroke="#265eab" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"><title>Rank-two flat: 1 2 15</title></path>
<path data-flat="1 6 16" d="M 72,253.2 L 382.857,284.286 L 840,330" fill="none" stroke="#d17b0f" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"><title>Rank-two flat: 1 6 16</title></path>
