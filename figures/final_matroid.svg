<path d="M 735,755 h 22" stroke="#b53b69" stroke-width="3" stroke-dasharray="6 4"/>
<text x="765" y="760" font-size="14" fill="#172033">Missing axis</text>
<text x="30" y="795" font-size="13" fill="#172033">Solid curves: rank-2 flats. Dashed axis: absent (rank 3). Unmarked crossings are not elements.</text>
