<path data-flat="4 8 12" d="M 200,170 L 200,330 L 200,650" fill="none" stroke="#7d97b0" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"><title>Rank-two flat: 4 8 12</title></path>
