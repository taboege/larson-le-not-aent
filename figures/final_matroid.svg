<path data-guide="1 5 14" d="M 72,253.2 C 125,65 335,85 413.333,223.333 C 505,385 585,460 520,490" fill="none" stroke="#b53b69" stroke-width="2.8" stroke-dasharray="9 7" stroke-linecap="round"><title>Missing Desargues axis: {1,5,14} has rank 3, not 2</title></path>
<circle data-point="1" cx="72" cy="253.2" r="5.5" fill="#b53b69" stroke="white" stroke-width="1.6"/>
